<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='/favicon.ico') }}"/>
    <link rel="stylesheet" href="/static/assistant_style.css">
    <title>Medusa Codes - Chatbot</title>
</head>
  
<body>
    <!-- Popup Modal-->
    <div class="popup-overlay" id="popup">
        <div class="popup-content">
            <p>Welcome! Please continue as a guest.</p>

            <!-- Login function to be added 
            <button onclick="closePopup()">Login</button> -->
            <button onclick="setGuestToken()">Continue as Guest</button>
        </div>
    </div>

    <main class="page-content chat-shell" id="main-content">
        <header class="chat-header">
            <h1>Personal Assistant</h1>
            <div id="output" class="session-status"></div>
        </header>

        <section id="chat-messages" class="chat-messages" aria-live="polite">
            <div class="chat-message assistant-message">
                <div class="message-bubble">
                    <p>Ask me a question when you're ready.</p>
                </div>
            </div>
        </section>

        <form id="question-form" class="chat-input-bar">
            <input type="text" id="question" name="question" placeholder="Message the assistant" autocomplete="off" required>
            <button type="submit" class="send-button">Send</button>
        </form>
    </main>

    <script src="/static/assistant_script.js"></script>
</body>
</html>
